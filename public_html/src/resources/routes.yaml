# app/config/routes.yaml
home:
    path: /
    controller: Home
    methods: ['GET', 'HEAD', 'POST']

setLocale:
    path: /set/locale/{locale}
    controller: SetLocale
    methods: ['GET', 'HEAD']

login:
    path: /login
    controller: LoginController::login
    methods: ['GET', 'HEAD', 'POST']

register:
    path: /register
    controller: RegistrationController::register
    methods: ['GET', 'HEAD', 'POST']

account:
    path: /account
    controller: Account
    methods: ['GET', 'HEAD', 'POST']

accountRecoveryCodes:
    path: /account/recovery-codes
    controller: AccountRecoveryCodesController::account
    methods: ['GET', 'HEAD', 'POST']

accountAuthenticatorEnroll:
    path: /account/authenticator/enroll
    controller: AccountRecoveryCodesController::startEnrollment
    methods: ['POST']

accountRecoveryCodesInitial:
    path: /account/recovery-codes/initial
    controller: AccountRecoveryCodesController::startInitial
    methods: ['POST']

accountRecoveryCodesReplace:
    path: /account/recovery-codes/replace
    controller: AccountRecoveryCodesController::startReplacement
    methods: ['POST']

loginRecoveryStart:
    path: /login/recovery/start
    controller: LostAuthenticatorRecoveryController::start
    methods: ['POST']

loginRecovery:
    path: /login/recovery
    controller: LostAuthenticatorRecoveryController::recovery
    methods: ['GET', 'HEAD', 'POST']

accountAuthenticatorDisableStart:
    path: /account/authenticator/disable/start
    controller: AuthenticatorSecurity::startDisable
    methods: ['POST']

accountAuthenticatorDisable:
    path: /account/authenticator/disable
    controller: AuthenticatorSecurity::disable
    methods: ['GET', 'HEAD', 'POST']

accountEmailVerify:
    path: /account/email/verify/{token}
    controller: Account::verifyEmailChange
    methods: ['GET', 'HEAD']

logout:
    path: /logout
    controller: Logout
    methods: ['GET', 'HEAD', 'POST']
